name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: production_environment

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      # Tailwind scans vendor/ for pagination views, so vendor must exist before the build.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # deploy.php runs `npm ci && npm run build` and uploads public/build.
      # Pin the revision so the server code matches the assets built here.
      - name: Deploy to Production
        uses: deployphp/action@v1
        with:
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          dep: deploy --revision=${{ github.sha }}
        env:
          DEPLOY_HOSTNAME: ${{ vars.DEPLOY_HOSTNAME }}
          DEPLOY_REMOTE_USER: ${{ vars.DEPLOY_REMOTE_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_BRANCH: main
